[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobi_method"
version = "0.1"
description = "метод Якоби для симметричной матрицы"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["jacobi_method*"]

[tool.pytest.ini_options]
testpaths = ["tests"]